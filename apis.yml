name: ESKape Sportsbook Feed
image: https://eskape.pro/brand/og-card.png
description: ESKape Sportsbook Feed provides a B2B football odds API for licensed betting operators and platforms. It offers RESTful JSON endpoints
  for pre‑match odds, risk management, and live updates via SignalR on paid plans. The free 90‑day plan includes access to the full pre‑match
  catalogue, with quota limits and clear error handling. Designed for business‑to‑business integration, it is not for private individuals or consumer
  betting sites.
